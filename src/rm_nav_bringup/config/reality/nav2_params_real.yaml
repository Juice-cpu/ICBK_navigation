controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.1
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 8.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3

    FollowPath:
      plugin: teb_local_planner::TebLocalPlannerROS

      #*******************************************************************************
      # Trajectory
      #*******************************************************************************
      teb_autosize: 1.0
      dt_ref: 0.6
      dt_hysteresis: 0.06
      max_samples: 500
      global_plan_overwrite_orientation: False
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 3.0
      force_reinit_new_goal_dist: 1.0
      force_reinit_new_goal_angular: 0.78
      feasibility_check_no_poses: 4
      feasibility_check_lookahead_distance: 5.0
      exact_arc_length: False
      publish_feedback: False
      visualize_with_time_as_z_axis_scale: 0.0

      #*******************************************************************************
      # ViaPoints
      #*******************************************************************************
      global_plan_viapoint_sep: 1.5
      via_points_ordered: False

      #*******************************************************************************
      # Robot (舵轮动力学约束)
      #*******************************************************************************
      max_vel_x: 2.5                         
      max_vel_x_backwards: 2.5               
      max_vel_theta: 4.0                     # 限制舵轮最大转向角速度
      max_vel_y: 2.5                         
      acc_lim_x: 2.0                         
      acc_lim_y: 1.5                         # 舵轮横移需等轮子转向，加速度偏保守
      acc_lim_theta: 3.0                     # 限制转向角加速度
      is_footprint_dynamic: False
      use_proportional_saturation: True      
      transform_tolerance: 0.5

      #*******************************************************************************
      # GoalTolerance
      #*******************************************************************************
      free_goal_vel: False

      #*******************************************************************************
      # Obstacles
      #*******************************************************************************
      min_obstacle_dist: 0.3                 
      inflation_dist: 1.0                    
      dynamic_obstacle_inflation_dist: 0.7
      include_dynamic_obstacles: False       
      include_costmap_obstacles: True
      legacy_obstacle_association: False
      costmap_obstacles_behind_robot_dist: 1.5
      obstacle_poses_affected: 15

      #*******************************************************************************
      # Obstacle - Velocity ratio parameters
      #*******************************************************************************
      obstacle_proximity_ratio_max_vel: 1.0
      obstacle_proximity_lower_bound: 0.3    
      obstacle_proximity_upper_bound: 1.2    

      #*******************************************************************************
      # Optimization (舵轮核心权重：惩罚横移和倒车)
      #*******************************************************************************
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.15

      obstacle_cost_exponent: 4.0
      weight_max_vel_x: 2.0
      weight_max_vel_y: 2.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_y: 1.0
      weight_acc_lim_theta: 1.0
      weight_kinematics_nh: 150.0            # 极大增加非全向约束，强制走前向曲线，避免舵轮乱转
      weight_kinematics_forward_drive: 50.0  # 惩罚倒车
      weight_kinematics_turning_radius: 1.0  
      weight_optimaltime: 1.0               
      weight_shortest_path: 0.0
      weight_obstacle: 500.0                
      weight_inflation: 2.0                 
      weight_dynamic_obstacle: 0.0          
      weight_dynamic_obstacle_inflation: 0.0
      weight_viapoint: 1.0
      weight_adapt_factor: 2.0

      #*******************************************************************************
      # Homotopy Class Planner
      #*******************************************************************************
      enable_homotopy_class_planning: False
      enable_multithreading: True
      max_number_classes: 3
      selection_cost_hysteresis: 1.0
      selection_prefer_initial_plan: 1.0
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: True

      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False

      #*******************************************************************************
      # Recovery
      #*******************************************************************************
      shrink_horizon_backup: True
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: True
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0
      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 10                             # 【已增大】从6米扩大到10米
      height: 10                            # 【已增大】从6米扩大到10米
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["voxel2d_layer", "voxel3d_layer", "inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0           
        inflation_radius: 1.2              
      
      voxel2d_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan 
        scan:
          topic: /scan
          raytrace_min_range: 0.0
          raytrace_max_range: 15.0
          min_obstacle_height: -0.2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          
      voxel3d_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True            # 调试时打开，确认坡面没被标红
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 20                       
        mark_threshold: 1
        observation_sources: livox
        # 全局高度框(针对590mm安装高度)
        min_obstacle_height: -0.6          # 允许负值，容纳平地看坡面的落差
        max_obstacle_height: 2.0
        livox:
          topic: /livox/lidar/pointcloud
          raytrace_min_range: 0.0
          raytrace_max_range: 15.0         # 射线清障范围保持较大
          obstacle_range: 1.8              # 【核心】3D点云仅在1.8米内标记障碍物，防止远距离坡面误报
          min_obstacle_height: -0.2        # 近距离过滤框，放过近处坡面
          max_obstacle_height: 0.8         # 近距离过滤框，确保车在坡上时，前方坡面(相对Z约0.2m)不被当墙
          clearing: True
          marking: True
          data_type: "PointCloud2"
          
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0                # 全局地图低频更新
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.3
      resolution: 0.05
      track_unknown_space: true
      # 【核心】全局地图移除3D点云层！防止坡底被误认为墙导致全局规划失败
      plugins: ["static_layer", "voxel2d_layer", "inflation_layer"]
      
      voxel2d_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          raytrace_min_range: 0.0
          raytrace_max_range: 20.0
          min_obstacle_height: -0.2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 1.5             
        
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: false               

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 3.0               
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.0               

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False                   
    smoothing_frequency: 20.0             
    scale_velocities: False
    feedback: "OPEN_LOOP"                 
    max_velocity: [2.5, 2.5, 4.0]        
    min_velocity: [-2.5, -2.5, -4.0]     
    max_accel: [2.0, 1.5, 3.0]           # 匹配舵轮动力学约束
    max_decel: [-2.0, -1.5, -3.0]        
    odom_topic: "Odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
